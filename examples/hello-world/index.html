<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>mwg: hello world (source)</title>
	<style>
		html, body { margin: 0; height: 100%; background: #14141a; overflow: hidden; }
		#game { display: block; width: 100vw; height: 100vh; }
		#not-built {
			color: #d0d0d8; font: 14px/1.8 ui-monospace, Consolas, monospace;
			padding: 40px; max-width: 44em;
		}
		#not-built code { color: #8ad9ff; }
		#not-built strong { color: #fff; }
	</style>
	<script>
		// This is the development page: it loads TypeScript through the vite dev server.
		// Opened from disk it can do neither, because file:// blocks ES modules and there
		// is no server to compile main.ts. Say so, rather than showing a black window.
		//
		// The built page is also opened from file://, and this script is copied into it,
		// so the test cannot be on the protocol alone. Compiled assets are the tell: the
		// build inserts a deferred script that defines them, and deferred scripts have all
		// run by the time DOMContentLoaded fires.
		addEventListener('DOMContentLoaded', function () {
			//the test has to happen here, not at parse time: the asset script is deferred,
			//so it has not run yet while this <head> is being read
			if (location.protocol !== 'file:' || window.__MWG_ASSETS__) return;

			document.body.innerHTML =
				'<div id="not-built">' +
				'<p><strong>This is the source page, not the built game.</strong></p>' +
				'<p>It loads TypeScript through the dev server, and a <code>file://</code> page can do neither.</p>' +
				'<p>To play it from disk, build it once:</p>' +
				'<p>&nbsp;&nbsp;<code>npm run example:hello-world:build</code></p>' +
				'<p>then open <code>dist/index.html</code>, in this same folder.</p>' +
				'<p>To develop against it instead, run <code>npm run example:hello-world</code> and open the address it prints.</p>' +
				'</div>';
		});
	</script>
</head>
<body>
	<canvas id="game"></canvas>
	<script type="module" src="./main.ts"></script>
</body>
</html>
