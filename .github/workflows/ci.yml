name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push on the same branch/PR supersedes a run still in flight
# read-only token: nothing here writes to the repository, so a compromised step cannot either
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The same gates on Linux and Windows, not a Linux gate with a Windows smoke beside it:
    # three of the committed-artifact checks (API_REPORT, PROJECT_STATS, sbom.cdx.json) and two
    # tests compared bytes, so a Windows checkout - where core.autocrlf hands text files over as
    # CRLF and the repository stores LF - failed them on a tree git reported as clean. Only a
    # Windows runner sees that class of breakage, and ubuntu-only CI never did.
    strategy:
      # one OS failing must not cancel the other: the pair is the point of the job
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      # tsc --noEmit over src, examples, tools, and tests - the same gate CLAUDE.md's own
      # "Verifying" section asks a human to run before calling anything done
      - run: npm run check
      # Prettier over src, tests, examples and tools: formatting only, no lint rules, so the
      # diff review stays about behaviour rather than whitespace
      - run: npm run format:check
      - run: npm test
      # the same suite again under a coverage floor, so coverage cannot quietly erode
      - run: npm run coverage:check
      # the library build (tsc emit + the standalone mw_games.global.js IIFE) - catches a
      # build break tsc --noEmit alone would not, such as a broken vite config
      - run: npm run build
      # the committed API_REPORT.md must match the declarations the build just emitted
      - run: npm run api:check
      # release statistics are committed and must stay reproducible from the checkout
      - run: npm run stats:check
      # the global bundle and the published dist stay inside their recorded size budget
      - run: npm run size:check
      # the committed CycloneDX SBOM must match package-lock.json, so a dependency change
      # cannot land without the supply-chain document moving with it
      - run: npm run sbom:check

  # The check no typechecker can make: one layout-heavy example is built, opened from
  # file:// in a real Chrome, and screenshotted, so a canvas that paints nothing (or a page
  # that throws on load) fails the pull request instead of shipping. It is a coarse smoke,
  # not a pixel baseline, deliberately: font and anti-aliasing differences between a
  # developer's machine and the runner would make a diff gate fail for the renderer rather
  # than for the change, the same reason the browser benchmark stays off the per-push path.
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # the example assets are generated, never downloaded (tools/make-example-assets.mjs)
      - run: npm run assets

      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "no Chrome on this runner; visual-smoke.mjs cannot run" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Build and smoke the interface example
        env:
          # no GPU on a runner: keep Pixi on a real WebGL path via ANGLE's software backend
          MWG_VISUAL_CHROME_ARGS: '--use-gl=angle --use-angle=swiftshader --disable-dev-shm-usage'
        run: npm run visual:smoke:ui

      # the same example three ways (no preference, `reduce` before load, and a flip while
      # the page is open), reading the demo's own state: the one check a unit test cannot make
      - name: Smoke the reduced-motion path
        env:
          MWG_VISUAL_CHROME_ARGS: '--use-gl=angle --use-angle=swiftshader --disable-dev-shm-usage'
        run: npm run motion:smoke

      # kept even when a smoke fails, so a reviewer can see what each page actually drew
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-smoke
          path: |
            benchmark-results/visual-smoke/
            benchmark-results/motion-smoke/
          if-no-files-found: warn

  # The central promise, checked rather than assumed: `npm pack`, install the tarball in a
  # scratch directory outside the repo, build the tutorial's own tiny game, and open both it
  # and the standalone global from file://. `tests/consumer-app.test.ts` names the public
  # specifiers but compiles against src/, so only a packed install proves the real thing.
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Locate Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "no Chrome on this runner; package-smoke.mjs cannot run" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Pack, install and open both documented paths
        env:
          MWG_VISUAL_CHROME_ARGS: '--use-gl=angle --use-angle=swiftshader --disable-dev-shm-usage'
        run: npm run package:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: package-smoke
          path: benchmark-results/package-smoke/
          if-no-files-found: warn

  # Every example page, not just the ones the benchmarks and the smoke happen to name: a
  # broken vite config or an emit-page/compile-resources regression in any other example
  # would otherwise ship unnoticed, since `npm run check` only typechecks them.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      # generates the shared assets first, then builds every example:*:build script
      - run: npm run examples:build

  # The one benchmark that needs no browser, no GPU and no example build: pure Node
  # throughput for mwg/simulation. Safe on every push because of what it does NOT do - it
  # starts from an empty benchmark-results/ every run, so there is no history to compare
  # against and the run can only fail if the runners actually throw or stop processing
  # every command. Comparing a shared GitHub runner's throughput against a best-seen value
  # measured on some other, faster runner is how a benchmark gate turns into a flaky gate,
  # so the regression half of this tool is deliberately left to a developer's own machine
  # and to the scheduled browser benchmark, which keeps its history in a cache.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      - run: npm run benchmark:simulation

      # kept as an artifact so a human can eyeball the numbers across runs even though CI
      # itself never asserts on them
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-simulation
          path: benchmark-results/
          if-no-files-found: warn
