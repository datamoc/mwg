name: Publish to npm

on:
  release:
    types: [published]
  # lets a maintainer re-run this exact workflow definition by hand (`gh workflow run
  # publish-npm.yml --ref <tag>`) - `gh run rerun` on a past run replays the workflow
  # snapshot pinned to that run's original trigger, not the file's current content, so it
  # cannot be used to test a workflow change against an already-published release
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing: npm exchanges this workflow's own OIDC identity for a short-lived
      # publish token itself, once npmjs.org's package settings list this repo/workflow as a
      # trusted publisher - no NPM_TOKEN secret (and no 2FA/OTP prompt a CI run can't answer,
      # which is what a classic automation token still hit) needed at all
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # must be v7, not v6: v6 exports a dummy NODE_AUTH_TOKEN fallback (defaulting to
      # github.token, a GitHub API token) into .npmrc even when no npm token is configured.
      # npm then tries that bogus credential against registry.npmjs.org before ever
      # attempting the OIDC exchange, and fails with E401 - which is exactly what every run
      # of this workflow did under v6. v7 removed that fallback for precisely this reason:
      # "npm Trusted Publishing (OIDC) is not affected, since it does not use NODE_AUTH_TOKEN."
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # never cache in a release build: a stale package-manager cache is exactly the
          # kind of non-reproducible state a published artifact must not depend on
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      # trusted publishing needs npm 11.5.1+ for the OIDC exchange; pin high enough that a
      # future Node LTS bundling an older npm doesn't silently fall back to failing for a
      # missing token
      - run: npm install -g npm@^11.5.1
      # the same gate CI already runs on every push; a tag alone proves nothing about
      # whether the code at that tag still builds and passes
      - run: npm run check
      - run: npm test
      - run: npm run build

      # staged, not direct: this uploads the tarball but leaves it pending. The npmjs.org
      # trusted publisher for this repo is configured to allow only `npm stage publish`, not
      # `npm publish` - so a compromised or buggy workflow run can never make a version
      # public by itself. `npm stage approve` needs interactive 2FA and is run by hand
      # (`npm stage list` shows what's pending); OIDC tokens cannot approve, only stage.
      - run: npm stage publish --access public
