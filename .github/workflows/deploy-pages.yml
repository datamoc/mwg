name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'webpage/**'
      - 'src/**'
      - 'examples/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; a new push cancels a run still in flight rather than
# queuing behind it, since only the latest commit's site is worth publishing
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      - run: npm run assets
      # generates webpage/examples/*/ and webpage/documentation/ (REFERENCE guide +
      # TypeDoc under documentation/api/) - both gitignored, built fresh here rather than
      # committed, same as a local `npm run webpage:examples` / `npm run webpage:docs`
      # before opening the site by hand
      - run: npm run webpage:examples
      - run: npm run webpage:docs
      - run: npm run stats:write

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: webpage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
