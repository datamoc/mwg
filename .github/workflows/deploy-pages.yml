name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'webpage/**'
      - 'src/**'
      - 'examples/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; a new push cancels a run still in flight rather than
# queuing behind it, since only the latest commit's site is worth publishing
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      - run: npm run assets
      # generates webpage/examples/*/ and webpage/documentation/ (REFERENCE guide +
      # TypeDoc under documentation/api/) - both gitignored, built fresh here rather than
      # committed, same as a local `npm run webpage:examples` / `npm run webpage:docs`
      # before opening the site by hand
      - run: npm run webpage:examples
      - run: npm run webpage:docs
      - run: npm run stats:write

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: webpage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
