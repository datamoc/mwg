<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#596273"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<rect x="0" y="0" width="100%" height="12" fill="#e53935"/>
<text x="70" y="82" fill="#f3f4f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">RPG flow: state → active page → commands</text>
<text x="70" y="122" fill="#aab2bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">The event model at the heart of MWG's RPG system</text>

<g filter="url(#shadow)">
  <rect x="70" y="190" width="330" height="220" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="190" width="8" height="220" rx="4" fill="#4ea1ff"/>
</g>
<text x="94" y="228" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">GameState</text>
<text x="94" y="262" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">switches: booleans</text><text x="94" y="290" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">variables: numbers</text><text x="94" y="318" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">e.g. metShopkeeper = true</text>
<line x1="400" y1="300" x2="560" y2="300" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/><text x="480.0" y="290.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">conditions</text>
<g filter="url(#shadow)">
  <rect x="560" y="175" width="450" height="250" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="560" y="175" width="8" height="250" rx="4" fill="#e53935"/>
</g>
<text x="584" y="213" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">MapEvent</text>
<text x="584" y="247" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">position (x,y)</text><text x="584" y="275" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">multiple EventPage entries</text><text x="584" y="303" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">the last valid page wins</text>
<line x1="785" y1="425" x2="785" y2="525" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/><text x="785.0" y="465.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">activePage()</text>
<g filter="url(#shadow)">
  <rect x="560" y="525" width="450" height="180" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="560" y="525" width="8" height="180" rx="4" fill="#4caf50"/>
</g>
<text x="584" y="563" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Active EventPage</text>
<text x="584" y="597" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">trigger</text><text x="584" y="625" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">commands[]</text><text x="584" y="653" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">optional frame / appearance</text>
<line x1="1010" y1="615" x2="1160" y2="615" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/><text x="1085.0" y="605.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">run</text>
<g filter="url(#shadow)">
  <rect x="1160" y="500" width="360" height="230" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1160" y="500" width="8" height="230" rx="4" fill="#f4c95d"/>
</g>
<text x="1184" y="538" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">EventRunner</text>
<text x="1184" y="572" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">say • ask • wait</text><text x="1184" y="600" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">setSwitch • addVariable</text><text x="1184" y="628" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">if • move • call</text>
<line x1="1340" y1="730" x2="1340" y2="840" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/><text x="1340.0" y="775.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">UI / effects</text>
<g filter="url(#shadow)">
  <rect x="1080" y="840" width="520" height="100" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1080" y="840" width="8" height="100" rx="4" fill="#ff6659"/>
</g>
<text x="1340.0" y="878" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">WindowStack / MessageBox / world</text>
<text x="1340.0" y="912" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">dialogue, choices, state changes, movement</text>
<line x1="1160" y1="560" x2="1010" y2="410" stroke="#596273" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 10"/><text x="1085.0" y="475.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">writes to</text>
<g filter="url(#shadow)">
  <rect x="70" y="520" width="330" height="180" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="520" width="8" height="180" rx="4" fill="#b05cff"/>
</g>
<text x="94" y="558" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Triggers</text>
<text x="94" y="592" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">action in front of an NPC</text><text x="94" y="620" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">autorun / cutscene</text><text x="94" y="648" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">touch / interaction</text>
<line x1="400" y1="610" x2="560" y2="610" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/><text x="480.0" y="600.0" fill="#aab2bf" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">triggers</text><text x="1530" y="964" fill="#667080" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">MWG — conceptual diagram</text></svg>