<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#596273"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<rect x="0" y="0" width="100%" height="12" fill="#e53935"/>
<text x="70" y="80" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">RPG flow: state to active page to commands</text>

<text x="70" y="120" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">The event model at the heart of MWG’s RPG system</text>

<text x="70" y="168" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A map event re-checks its pages rather than being told which one is live.</text>

<g filter="url(#shadow)">
  <rect x="70" y="260" width="260" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="260" width="8" height="300" rx="4" fill="#4caf50"/>
</g>

<text x="94" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">GameState</text>

<text x="94" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">switches: booleans</text>

<text x="94" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">variables: numbers</text>

<text x="94" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="94" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">e.g. metShopkeeper</text>

<text x="94" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">is true</text>

<line x1="336" y1="350" x2="362" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="370" y="260" width="260" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="370" y="260" width="8" height="300" rx="4" fill="#4ea1ff"/>
</g>

<text x="394" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">MapEvent</text>

<text x="394" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">a position on the map</text>

<text x="394" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">and several EventPages</text>

<text x="394" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="394" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">conditions are checked</text>

<text x="394" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">against GameState;</text>

<text x="394" y="486" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">the last valid page wins</text>

<line x1="636" y1="350" x2="662" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="670" y="260" width="260" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="670" y="260" width="8" height="300" rx="4" fill="#ffab40"/>
</g>

<text x="694" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Active EventPage</text>

<text x="694" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">a trigger: action,</text>

<text x="694" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">autorun or touch</text>

<text x="694" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="694" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">commands[] to run</text>

<text x="694" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">once it fires</text>

<line x1="936" y1="350" x2="962" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="970" y="260" width="260" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="970" y="260" width="8" height="300" rx="4" fill="#e53935"/>
</g>

<text x="994" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">EventRunner</text>

<text x="994" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">say / ask / wait</text>

<text x="994" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">setSwitch / addVariable</text>

<text x="994" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">if / move / call</text>

<text x="994" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="994" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">writes back to GameState,</text>

<text x="994" y="486" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">closing the loop</text>

<line x1="1236" y1="350" x2="1262" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="1270" y="260" width="260" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1270" y="260" width="8" height="300" rx="4" fill="#b05cff"/>
</g>

<text x="1294" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">DialoguePresenter</text>

<text x="1294" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">shows a line, resolves</text>

<text x="1294" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">with what was chosen</text>

<text x="1294" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="1294" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">two-d/ui supplies a</text>

<text x="1294" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">MessageBox one; a 3D</text>

<text x="1294" y="486" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">game supplies its own</text>

<text x="70" y="700" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The presenter is injected, so mwg/rpg needs no renderer: the same event scripts run under a 2D game, a 3D game, or a headless test.</text>

<text x="1530" y="964" fill="#667080" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Conceptual MWG diagram</text>

</svg>