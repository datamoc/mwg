<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#596273"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<rect x="0" y="0" width="100%" height="12" fill="#e53935"/>
<text x="70" y="80" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">MWG in its ecosystem</text>

<text x="70" y="120" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">What a game built on MWG actually stands on</text>

<text x="70" y="168" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">MWG is a TypeScript framework: your game imports it, and it imports these.</text>

<g filter="url(#shadow)">
  <rect x="70" y="210" width="470" height="306" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="210" width="8" height="306" rx="4" fill="#e53935"/>
</g>

<text x="94" y="252" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Your game</text>

<text x="94" y="282" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">TypeScript or JavaScript</text>

<g>
  <rect x="94" y="310" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="110" y="336" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">scenes and rules</text>
<text x="110" y="353" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">what the game is</text>
</g>
<g>
  <rect x="94" y="372" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="110" y="398" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">art, audio, data</text>
<text x="110" y="415" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">compiled in at build time</text>
</g>
<g>
  <rect x="94" y="434" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="110" y="460" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">its own numbers</text>
<text x="110" y="477" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">MWG supplies shape, never values</text>
</g>
<g filter="url(#shadow)">
  <rect x="564" y="210" width="470" height="306" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="564" y="210" width="8" height="306" rx="4" fill="#4caf50"/>
</g>

<text x="588" y="252" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">MWG</text>

<text x="588" y="282" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">MPL-2.0, redistributable</text>

<g>
  <rect x="588" y="310" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="604" y="336" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">core</text>
<text x="604" y="353" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">loop-adjacent lifecycle, input, saves, RNG</text>
</g>
<g>
  <rect x="588" y="372" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="604" y="398" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">gameplay modules</text>
<text x="604" y="415" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">actors, roguelike, rpg, battle, board, world</text>
</g>
<g>
  <rect x="588" y="434" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="604" y="460" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">two-d / 3d</text>
<text x="604" y="477" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">the rendering halves, chosen per game</text>
</g>
<g filter="url(#shadow)">
  <rect x="1058" y="210" width="470" height="306" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1058" y="210" width="8" height="306" rx="4" fill="#4ea1ff"/>
</g>

<text x="1082" y="252" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Underneath</text>

<text x="1082" y="282" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">third-party runtimes</text>

<g>
  <rect x="1082" y="310" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="1098" y="336" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">PixiJS</text>
<text x="1098" y="353" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">the 2D renderer, via mwg/two-d</text>
</g>
<g>
  <rect x="1082" y="372" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="1098" y="398" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Babylon.js</text>
<text x="1098" y="415" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">optional 3D, via mwg/3d</text>
</g>
<g>
  <rect x="1082" y="434" width="422" height="50" rx="10" fill="#1d222c" stroke="#333c4a"/>
<text x="1098" y="460" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">rot.js</text>
<text x="1098" y="477" fill="#7f8899" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">classic roguelike algorithms</text>
</g>
<text x="70" y="550" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Node and npm are developer tools here. Nothing from them is present when the game runs.</text>

<text x="1530" y="964" fill="#667080" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Conceptual MWG diagram</text>

</svg>