<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og image source</title>
<style>
	:root {
		--ink: #0b0e14;
		--paper: #eef1f6;
		--muted: #8b96a8;
		--multiply: #5b6ee1;
		--add: #ffb347;
		--line: rgba(238, 241, 246, 0.09);
		--font-display: 'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		--font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	}

	* {
		box-sizing: border-box;
	}

	html,
	body {
		margin: 0;
		width: 1200px;
		height: 630px;
		background: var(--ink);
		background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
		background-size: 32px 32px;
		overflow: hidden;
	}

	.card {
		width: 1200px;
		height: 630px;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 28px;
	}

	.squares {
		display: flex;
		gap: 14px;
	}

	.squares span {
		width: 84px;
		height: 84px;
		border-radius: 12px;
	}

	.squares .a {
		background: var(--add);
	}

	.squares .b {
		background: var(--multiply);
	}

	h1 {
		margin: 0;
		font-family: var(--font-display);
		font-weight: 700;
		font-size: 130px;
		letter-spacing: -0.02em;
		color: var(--paper);
		line-height: 1;
	}

	p {
		margin: 0;
		font-family: var(--font-body);
		font-size: 32px;
		color: var(--muted);
		text-align: center;
		max-width: 900px;
	}

	p strong {
		color: var(--paper);
		font-weight: 600;
	}
</style>
</head>
<body>
	<div class="card">
		<div class="squares"><span class="a"></span><span class="b"></span></div>
		<h1>mwg</h1>
		<p><strong>Open it by double-clicking.</strong> A 2D tile-game framework with no server, no install, no runtime to download.</p>
	</div>
</body>
</html>
