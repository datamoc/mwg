<text x="94" y="242" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Demonstrates windowing, widgets, labels, lists, buttons,</text>
<text x="94" y="270" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">and input focus.</text>


