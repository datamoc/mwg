<text x="864" y="242" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Best for understanding the reusable UI toolkit</text>
<text x="864" y="270" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">independently of any game genre.</text>


