<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#596273"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<rect x="0" y="0" width="100%" height="12" fill="#e53935"/>
<text x="70" y="80" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Running and deploying an MWG game</text>

<text x="70" y="120" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">From source to a file a player double-clicks</text>

<text x="70" y="168" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The target that shapes every build choice: a game you open from disk, with no server.</text>

<g filter="url(#shadow)">
  <rect x="70" y="260" width="335" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="260" width="8" height="300" rx="4" fill="#e53935"/>
</g>

<text x="94" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Author</text>

<text x="94" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">TypeScript, plus art</text>

<text x="94" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">and audio on disk.</text>

<text x="94" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="94" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Maps and events are</text>

<text x="94" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">data, not code.</text>

<line x1="411" y1="350" x2="437" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="445" y="260" width="335" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="445" y="260" width="8" height="300" rx="4" fill="#ffab40"/>
</g>

<text x="469" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Build</text>

<text x="469" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">compile-resources turns</text>

<text x="469" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">every asset into a data:</text>

<text x="469" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">URI inside a plain script.</text>

<text x="469" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="469" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">The library emits a</text>

<text x="469" y="486" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">classic IIFE, not ESM.</text>

<line x1="786" y1="350" x2="812" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="820" y="260" width="335" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="820" y="260" width="8" height="300" rx="4" fill="#4caf50"/>
</g>

<text x="844" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Artifact</text>

<text x="844" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">One folder: index.html,</text>

<text x="844" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">game.js, asset scripts.</text>

<text x="844" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="844" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">No install step, no</text>

<text x="844" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">runtime to download.</text>

<line x1="1161" y1="350" x2="1187" y2="350" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="1195" y="260" width="335" height="300" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1195" y="260" width="8" height="300" rx="4" fill="#4ea1ff"/>
</g>

<text x="1219" y="306" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Run</text>

<text x="1219" y="346" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Opens from file://,</text>

<text x="1219" y="374" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">a static host, Capacitor</text>

<text x="1219" y="402" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">or a WebView2 desktop</text>

<text x="1219" y="430" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">shell, unchanged.</text>

<text x="1219" y="458" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16"></text>

<text x="1219" y="486" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Draws through WebGL.</text>

<text x="70" y="700" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">file:// blocks ES modules, fetch() and cross-origin images, which is why assets are compiled in and the bundle is a classic script.</text>

<text x="70" y="732" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Everything after load is synchronous: game code never awaits an asset mid-scene.</text>

<text x="1530" y="964" fill="#667080" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Conceptual MWG diagram</text>

</svg>