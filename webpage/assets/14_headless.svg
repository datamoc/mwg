<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#596273"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#0b0d10"/>
<rect x="0" y="0" width="100%" height="12" fill="#e53935"/>
<text x="70" y="80" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">MWG example — headless simulation</text>

<text x="70" y="120" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">runScenario and advanceToInput, with no rendering at all</text>

<g filter="url(#shadow)">
  <rect x="70" y="170" width="690" height="180" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="170" width="8" height="180" rx="4" fill="#4ea1ff"/>
</g>

<text x="94" y="208" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">What this example shows</text>

<text x="94" y="242" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Demonstrates replaying a finite command sequence and</text>

<text x="94" y="270" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">driving automatic turns to the next input.</text>

<g filter="url(#shadow)">
  <rect x="840" y="170" width="690" height="180" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="840" y="170" width="8" height="180" rx="4" fill="#e53935"/>
</g>

<text x="864" y="208" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Why it matters</text>

<text x="864" y="242" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The one example that works identically with no page,</text>

<text x="864" y="270" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">canvas, or Pixi around it.</text>

<g filter="url(#shadow)">
  <rect x="70" y="390" width="1460" height="100" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="390" width="8" height="100" rx="4" fill="#b05cff"/>
</g>

<text x="94" y="428" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Main MWG modules</text>

<text x="94" y="462" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17"></text>

<g>
  <rect x="130" y="432" width="116" height="38" rx="19" fill="#261a2d" stroke="#5d4086"/>
<text x="188" y="457" fill="#ead9ff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">simulation</text>
</g>
<g filter="url(#shadow)">
  <rect x="70" y="550" width="410" height="240" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="550" width="8" height="240" rx="4" fill="#4ea1ff"/>
</g>

<text x="94" y="588" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">runScenario</text>

<text x="94" y="622" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">state + commands</text>

<text x="94" y="650" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">step(state, command)</text>

<text x="94" y="678" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">ordered events</text>

<g filter="url(#shadow)">
  <rect x="560" y="550" width="410" height="240" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="560" y="550" width="8" height="240" rx="4" fill="#e53935"/>
</g>

<text x="584" y="588" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">advanceToInput</text>

<text x="584" y="622" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">scheduler.peek</text>

<text x="584" y="650" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">needsInput(actor)</text>

<text x="584" y="678" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">budgeted steps</text>

<g filter="url(#shadow)">
  <rect x="1050" y="550" width="410" height="240" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1050" y="550" width="8" height="240" rx="4" fill="#4caf50"/>
</g>

<text x="1074" y="588" fill="#f3f4f6" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">No rendering</text>

<text x="1074" y="622" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">no canvas</text>

<text x="1074" y="650" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">no Pixi</text>

<text x="1074" y="678" fill="#aab2bf" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">same in a test or server</text>

<g filter="url(#shadow)">
  <rect x="70" y="810" width="180" height="90" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="70" y="810" width="8" height="90" rx="4" fill="#ff6659"/>
</g>

<text x="160" y="848" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Commands queued</text>

<line x1="250" y1="855" x2="360" y2="855" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="360" y="810" width="180" height="90" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="360" y="810" width="8" height="90" rx="4" fill="#ff6659"/>
</g>

<text x="450" y="848" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">step() runs</text>

<line x1="540" y1="855" x2="650" y2="855" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="650" y="810" width="180" height="90" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="650" y="810" width="8" height="90" rx="4" fill="#ff6659"/>
</g>

<text x="740" y="848" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Events collected</text>

<line x1="830" y1="855" x2="940" y2="855" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="940" y="810" width="180" height="90" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="940" y="810" width="8" height="90" rx="4" fill="#ff6659"/>
</g>

<text x="1030" y="848" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Scheduler advances</text>

<line x1="1120" y1="855" x2="1230" y2="855" stroke="#596273" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
  <rect x="1230" y="810" width="180" height="90" rx="18" fill="#151922" stroke="#2a3240" stroke-width="2"/>
  <rect x="1230" y="810" width="8" height="90" rx="4" fill="#ff6659"/>
</g>

<text x="1320" y="848" fill="#f3f4f6" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Input needed</text>

<line x1="275" y1="790" x2="160" y2="810" stroke="#596273" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<line x1="765" y1="790" x2="740" y2="810" stroke="#596273" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<line x1="1255" y1="790" x2="1320" y2="810" stroke="#596273" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 10"/>
<text x="1530" y="964" fill="#667080" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Conceptual MWG example diagram</text>

</svg>